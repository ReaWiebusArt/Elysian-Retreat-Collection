<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fdfdfc"><meta name="description" content="Art by Rea — paintings inspired by Elysian Retreat and the Whitsundays. Physical prints for purchase and collection on site.">
  <title>Art by Rea | The Elysian Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="site-data.js" defer></script><script src="site.js" defer></script>
</head><body>
<a class="skip" href="#collection">Skip to artworks</a>
<header class="header"><div class="wrap header-inner">
  <a class="brand" href="#top" id="brand">Art by Rea</a>
  <nav class="nav" aria-label="Main navigation"><a href="#collection">Collection</a><a href="#how-it-works">How it works</a></nav>
</div></header>
<main id="top"><section class="hero"><div class="wrap hero-content">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="hero-title"><span class="line" id="hero-line-1"></span><span class="line"><em id="hero-line-2"></em></span></h1>
  <p id="intro"></p><a class="downlink" href="#collection">View the collection <span class="arrow" aria-hidden="true">↓</span></a>
</div></section>
<section class="wrap collection" id="collection"><div class="section-intro">
  <div><span class="kicker">Original art / the Whitsundays</span><h2 id="collection-heading"></h2></div>
  <p id="collection-subheading"></p>
</div><div id="gallery" class="gallery"></div>
<div class="purchase-note"><span class="note-label">An Elysian exclusive</span><p class="note-body" id="location-note"></p></div>
</section><section class="how" id="how-it-works"><div class="wrap"><div class="how-content">
  <span class="kicker">Your artwork</span><h2 id="how-heading"></h2><div id="steps" class="steps"></div>
</div></div></section></main>
<footer><div class="wrap"><div class="footer-content"><span class="kicker">From Elysian, with love</span><h2 id="footer-heading"></h2></div>
<div class="footer-bottom"><div id="footer-brand">Art by Rea · The Elysian Collection</div><div id="footer-small"></div></div>
</div></footer>
<dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-title"><button class="lightbox-close" id="close-lightbox" aria-label="Close artwork view">×</button>
  <div class="lightbox-inner"><img id="lightbox-image" class="lightbox-img" alt=""><div class="lightbox-detail"><span class="kicker">Elysian collection</span>
    <h2 id="lightbox-title"></h2><p id="lightbox-description"></p><div id="lightbox-price" class="lightbox-price"></div>
    <a id="lightbox-buy" class="buy" target="_blank" rel="noopener noreferrer">Purchase print</a>
  </div></div>
</dialog>
</body></html>
